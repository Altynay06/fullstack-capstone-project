services:
  mongo:
    image: mongo:7.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./server/database
    environment:
      MONGO_URL: mongodb://mongo:27017/dealershipsDB
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:3030:3030"
  sentiment:
    build: ./server/djangoapp/microservices
    ports:
      - "127.0.0.1:5050:5050"
  web:
    build: ./server
    environment:
      backend_url: http://api:3030
      sentiment_analyzer_url: http://sentiment:5050
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: "0"
      DJANGO_DB_PATH: /app/db/db.sqlite3
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports:
      - "8000:8000"
    volumes:
      - django-data:/app/db
    depends_on:
      - api
      - sentiment
volumes:
  mongo-data:
  django-data:
